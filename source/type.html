<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ringmast4r hero type</title>
<!-- The name and tagline under the spinning hat; render_hero.py screenshots this at 2x on a transparent
     background. Cinzel Decorative as on ringmast4r.com's circus pages, DM Mono as on its home page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=DM+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .box { position: relative; width: 1200px; height: 640px; }
  .name { position: absolute; left: 0; right: 0; top: 500px; text-align: center;
    font: 700 54px/1 'Cinzel Decorative', serif; letter-spacing: .08em; color: #fff;
    text-shadow: 0 0 26px rgba(204,0,0,.55), 0 2px 0 rgba(0,0,0,.6); }
  .name b { font-weight: 700; color: #e01010; }
  .tag { position: absolute; left: 0; right: 0; top: 576px; text-align: center;
    font: 500 13px/1 'DM Mono', monospace; letter-spacing: .3em; text-transform: uppercase; color: #d9cfc4; }
  .tag i { font-style: normal; color: #cc0000; padding: 0 .55em; }
</style>
</head>
<body>
<div class="box">
  <div class="name">RINGMAST<b>4</b>R</div>
  <div class="tag">osint<i>·</i>security infrastructure<i>·</i>mapping the internet's backbone</div>
</div>
</body>
</html>
