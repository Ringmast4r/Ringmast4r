<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ringmast4r README tiles</title>
<!-- One tile per project for the Ringmast4r profile README: every repo is its own act. capture_tiles.py
     sets window.TILES from tiles.json, calls build(), and screenshots each .tile at 2x. The picture is the
     project's own (window), its logo (emblem), its README command (terminal), or a headline. House
     colours: black and red #CC0000, warm bulb light, the hat's gold for the marquee. Fonts as on
     ringmast4r.com: Big Shoulders Display, DM Sans, DM Mono. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Cinzel+Decorative:wght@700&display=block" rel="stylesheet">
<style>
  :root { --red: #cc0000; --hot: #ff2a2a; --ink: #f4ede4; --muted: #b9aaa0; --line: rgba(255,70,60,.20); --bulb: #ffd9a0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 30px; background: #000; color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 30px; width: 1300px; }
  .tile { position: relative; width: 600px; height: 470px; overflow: hidden; border-radius: 26px; border: 1.5px solid var(--line);
    background:
      radial-gradient(420px 280px at 50% 34%, rgba(204,0,0,.30), transparent 72%),
      radial-gradient(300px 120px at 50% 58%, rgba(255,220,180,.06), transparent 70%),
      linear-gradient(180deg, #120909 0%, #070404 60%, #050303 100%);
    box-shadow: inset 0 1px 0 rgba(255,120,100,.12); }
  /* spotlight cone from the top */
  .tile::before { content: ""; position: absolute; left: 50%; top: -20px; width: 520px; height: 330px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 0%, rgba(255,236,210,.10), transparent 70%); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); pointer-events: none; }
  /* the marquee: a row of bulbs along the top */
  .bulbs { position: absolute; left: 22px; right: 22px; top: 12px; height: 10px; display: flex; justify-content: space-between; z-index: 3; }
  .bulbs i { width: 7px; height: 7px; border-radius: 50%; background: var(--bulb); box-shadow: 0 0 8px 2px rgba(255,190,110,.75), 0 0 2px #fff inset; }
  .bulbs i:nth-child(3n+2) { background: #b0453a; box-shadow: 0 0 6px 1px rgba(204,0,0,.6); }
  .stage { position: absolute; left: 0; right: 0; top: 30px; height: 250px; perspective: 1100px; z-index: 1; }
  .win { position: absolute; left: 50%; top: 14px; width: 430px; margin-left: -215px; border-radius: 12px; overflow: hidden; background: #0d0909;
    transform: rotateX(8deg) rotateY(var(--ry, -10deg)); box-shadow: 0 0 0 1.5px rgba(255,120,100,.28), 0 40px 50px -20px #000, 0 0 70px -10px rgba(204,0,0,.55); }
  .win .bar { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: linear-gradient(180deg, #221414, #160c0c); border-bottom: 1px solid rgba(255,120,100,.14); }
  .win .bar i { width: 8px; height: 8px; border-radius: 50%; background: #4a3434; flex: none; }
  .win .bar i:first-child { background: var(--red); box-shadow: 0 0 6px rgba(255,40,40,.9); }
  .win .bar span { margin-left: 8px; flex: 1; height: 15px; border-radius: 8px; background: rgba(255,200,180,.07); padding: 0 8px;
    font: 500 9.5px/15px 'DM Mono', monospace; color: #e8b8a8; white-space: nowrap; overflow: hidden; }
  .win img { display: block; width: 100%; height: 200px; object-fit: cover; object-position: top center; }
  .win::after { content: ""; position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,.12), transparent 36%); pointer-events: none; }
  .emblem { position: absolute; left: 50%; top: 18px; width: 210px; height: 210px; margin-left: -105px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 2px rgba(255,190,110,.55), 0 0 0 9px rgba(204,0,0,.25), 0 0 60px rgba(204,0,0,.6), 0 30px 40px -16px #000; transform: rotateX(6deg) rotateY(-12deg); }
  .emblem img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .term { position: absolute; left: 50%; top: 20px; width: 470px; margin-left: -235px; border-radius: 12px; background: #0a0606; padding-bottom: 14px;
    transform: rotateX(8deg) rotateY(-10deg); box-shadow: 0 0 0 1.5px rgba(255,120,100,.26), 0 40px 50px -20px #000, 0 0 70px -12px rgba(204,0,0,.55);
    font: 500 14px/1.9 'DM Mono', monospace; color: #f0e2d8; }
  .term .bar { height: 24px; border-bottom: 1px solid rgba(255,120,100,.12); background: #160c0c; border-radius: 12px 12px 0 0; position: relative; }
  .term .bar::after { content: ""; position: absolute; left: 12px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 13px 0 0 #4a3434, 26px 0 0 #4a3434; }
  .term .bar b { position: absolute; left: 0; right: 0; text-align: center; font: 500 10px/24px 'DM Mono'; color: #9b8378; }
  .term pre { margin: 10px 18px 0; font: inherit; white-space: pre; overflow: hidden; }
  .term .p { color: var(--hot); }
  .term .cur { display: inline-block; width: 9px; height: 16px; background: var(--hot); vertical-align: -3px; box-shadow: 0 0 8px var(--hot); }
  .headline { position: absolute; left: 0; right: 0; top: 16px; height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .headline::before { content: ""; position: absolute; width: 330px; height: 330px; border-radius: 50%;
    background: repeating-radial-gradient(circle, transparent 0 26px, rgba(204,0,0,.22) 27px 28px); mask-image: radial-gradient(circle, #000 40%, transparent 70%); }
  .headline b { position: relative; font: 900 132px/0.9 'Big Shoulders Display', sans-serif; letter-spacing: .01em; color: #fff;
    text-shadow: 0 0 30px rgba(255,40,40,.75), 0 0 2px #fff, 0 4px 0 #6d0000; white-space: nowrap; }
  .headline small { position: relative; margin-top: 14px; font: 500 12.5px/1 'DM Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #f0c8b8; }
  .floor { position: absolute; left: 60px; right: 60px; top: 262px; height: 18px; background: radial-gradient(ellipse, rgba(255,220,180,.10), transparent 70%); z-index: 0; }
  .info { position: absolute; left: 30px; right: 30px; bottom: 26px; z-index: 2; }
  .meta { display: flex; align-items: center; gap: 12px; font: 500 12px/1 'DM Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #c9a99a; }
  .meta .act { color: var(--hot); font-weight: 500; }
  .meta .star { color: #ffd38a; }
  .meta .demo { margin-left: auto; padding: 6px 9px; border-radius: 6px; border: 1px solid rgba(255,60,60,.7); color: #ff6a6a; background: rgba(204,0,0,.12); letter-spacing: .12em; }
  h3 { margin: 12px 0 8px; font: 800 44px/0.95 'Big Shoulders Display', sans-serif; letter-spacing: .02em; text-transform: uppercase; color: #fff; white-space: nowrap; }
  p { margin: 0; font: 400 15px/1.45 'DM Sans'; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 43.5px; }
  .tile::after { content: ""; position: absolute; left: 30px; top: 290px; width: 54px; height: 3px; background: var(--red); box-shadow: 0 0 12px rgba(255,40,40,.8); }

  .foot { width: 1230px; height: 160px; display: flex; align-items: center; justify-content: center; gap: 26px; border-top: 1px solid var(--line);
    background: radial-gradient(500px 120px at 50% 50%, rgba(204,0,0,.18), transparent 70%), linear-gradient(180deg, #0c0606, #000); }
  .foot img { height: 96px; filter: drop-shadow(0 0 16px rgba(204,0,0,.6)); }
  .foot .w { font: 700 34px/1 'Cinzel Decorative', serif; letter-spacing: .06em; color: #fff; text-shadow: 0 0 18px rgba(204,0,0,.5); }
  .foot .w b { color: #e01010; font-weight: 700; }
  .foot small { display: block; margin-top: 10px; font: 500 12px/1 'DM Mono'; letter-spacing: .38em; text-transform: uppercase; color: #c9a99a; }
  .foot i { width: 80px; height: 2px; background: linear-gradient(90deg, transparent, var(--red)); }
  .foot i:last-child { background: linear-gradient(90deg, var(--red), transparent); }
</style>
</head>
<body>
<div class="foot" id="foot"><i></i><img src="media/tophat.png" alt=""><div><div class="w">RINGMAST<b>4</b>R</div><small>welcome to the circus</small></div><i></i></div>
<template id="tpl">
  <section class="tile">
    <div class="bulbs"></div>
    <div class="stage"></div>
    <div class="floor"></div>
    <div class="info">
      <div class="meta"><span class="act"></span><span class="star"></span><span class="lang"></span></div>
      <h3></h3>
      <p></p>
    </div>
  </section>
</template>
<script>
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  window.build = () => {
    const tpl = document.getElementById('tpl'), foot = document.getElementById('foot');
    TILES.forEach((t, i) => {
      const el = tpl.content.firstElementChild.cloneNode(true);
      el.id = 'tile-' + t.repo;
      el.querySelector('.bulbs').innerHTML = '<i></i>'.repeat(26);
      const st = el.querySelector('.stage');
      if (t.kind === 'window') {
        st.innerHTML = `<div class="win" style="--ry:${i % 2 ? 10 : -10}deg"><div class="bar"><i></i><i></i><i></i><span>github.com/Ringmast4r/${esc(t.repo)}</span></div><img src="${t.media}" alt=""></div>`;
      } else if (t.kind === 'emblem') {
        st.innerHTML = `<div class="emblem"><img src="${t.media}" alt=""></div>`;
      } else if (t.kind === 'terminal') {
        const lines = t.term.map(l => `<span class="p">$</span> ${esc(l)}`).join('\n');
        st.innerHTML = `<div class="term"><div class="bar"><b>${esc(t.repo.toLowerCase())}</b></div><pre>${lines}\n<span class="p">$</span> <span class="cur"></span></pre></div>`;
      } else {
        st.innerHTML = `<div class="headline"><b>${esc(t.big[0])}</b><small>${esc(t.big[1] || '')}</small></div>`;
      }
      el.querySelector('.act').textContent = 'act ' + String(i + 1).padStart(2, '0');
      el.querySelector('.star').textContent = '★ ' + t.stars;
      el.querySelector('.lang').textContent = t.lang || '';
      if (t.demo) el.querySelector('.meta').insertAdjacentHTML('beforeend', '<span class="demo">live demo</span>');
      el.querySelector('h3').textContent = t.repo.replace(/[-_]/g, ' ');
      el.querySelector('p').textContent = t.desc;
      document.body.insertBefore(el, foot);
    });
  };
  window.fit = () => document.querySelectorAll('.tile').forEach(el => {
    // a wide banner: show it whole, the window shrinks to fit it and sits in the middle of the stage
    el.querySelectorAll('.win img').forEach(im => { if (im.naturalWidth / im.naturalHeight > 2.1) {
      im.style.height = 'auto'; const w = im.closest('.win'); w.style.top = Math.max(14, (230 - w.offsetHeight) / 2) + 'px'; } });
    const h = el.querySelector('h3'); let n = 44; h.style.fontSize = '';
    while (h.scrollWidth > 540 && n > 22) { n -= 1; h.style.fontSize = n + 'px'; }
    const b = el.querySelector('.headline b'); if (b) { let m = 132; while (b.scrollWidth > 520 && m > 40) { m -= 4; b.style.fontSize = m + 'px'; } }
    el.querySelectorAll('.term pre').forEach(pre => { let k = 14; while (pre.scrollWidth > pre.clientWidth + 1 && k > 10) { k -= 0.5; pre.parentElement.style.fontSize = k + 'px'; } });
  });
</script>
</body>
</html>
